<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <rect width="600" height="360" fill="#f8faf9" rx="16" />
  
  <!-- Ventana de mensaje nuevo -->
  <rect x="50" y="30" width="500" height="300" rx="12" fill="#ffffff" stroke="#1a3a2a" stroke-width="2" />
  <rect x="50" y="30" width="500" height="44" rx="12" fill="#1a3a2a" />
  <text x="70" y="58" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Mensaje nuevo</text>
  
  <!-- Campo Para -->
  <text x="70" y="110" fill="#1a3a2a" font-family="sans-serif" font-size="16" font-weight="bold">Para:</text>
  <rect x="130" y="88" width="390" height="36" rx="6" fill="#f1f5f2" stroke="#d9d6cc" />
  <text x="145" y="112" fill="#555555" font-family="sans-serif" font-size="15">ejemplo@gmail.com</text>
  
  <!-- Campo Asunto -->
  <text x="70" y="170" fill="#1a3a2a" font-family="sans-serif" font-size="16" font-weight="bold">Asunto:</text>
  <rect x="130" y="148" width="390" height="36" rx="6" fill="#fff9e6" stroke="#f5b400" stroke-width="2" />
  <text x="145" y="172" fill="#1a3a2a" font-family="sans-serif" font-size="15" font-weight="bold">Fotos del paseo</text>
  
  <!-- Área de texto del mensaje -->
  <rect x="70" y="200" width="450" height="110" rx="6" fill="#ffffff" stroke="#d9d6cc" />
  <text x="85" y="230" fill="#777777" font-family="sans-serif" font-size="15">Escribe aquí tu saludo...</text>
</svg>
