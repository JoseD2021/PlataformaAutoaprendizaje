<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <rect width="600" height="360" fill="#f8faf9" rx="16" />
  
  <!-- Ventana de mensaje nuevo -->
  <rect x="50" y="30" width="500" height="300" rx="12" fill="#ffffff" stroke="#1a3a2a" stroke-width="2" />
  <rect x="50" y="30" width="500" height="44" rx="12" fill="#1a3a2a" />
  <text x="70" y="58" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Mensaje nuevo</text>
  
  <!-- Líneas de datos previos -->
  <text x="70" y="105" fill="#555" font-family="sans-serif" font-size="14">Para: familiar@gmail.com</text>
  <text x="70" y="130" fill="#555" font-family="sans-serif" font-size="14">Asunto: Fotos del paseo</text>
  <line x1="70" y1="145" x2="520" y2="145" stroke="#e0e0e0" />
  
  <text x="70" y="180" fill="#333" font-family="sans-serif" font-size="15">Hola, aquí te mando la foto prometida.</text>
  
  <!-- Barra inferior de herramientas con clip destacado -->
  <rect x="50" y="260" width="500" height="70" rx="0 0 12 12" fill="#f1f5f2" stroke="#1a3a2a" stroke-width="1" />
  
  <!-- Botón clip sujetapapeles resaltado -->
  <circle cx="210" cy="295" r="26" fill="#f5b400" stroke="#1a3a2a" stroke-width="3" />
  <!-- Ícono de clip (paperclip) -->
  <path d="M 205 290 L 217 278 A 7 7 0 0 1 227 288 L 207 308 A 12 12 0 0 1 190 291 L 210 271" fill="none" stroke="#1a3a2a" stroke-width="3" stroke-linecap="round" />
  
  <circle cx="270" cy="295" r="16" fill="#c8102e" />
  <text x="270" y="301" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">3</text>
  <text x="300" y="301" fill="#1a3a2a" font-family="sans-serif" font-size="16" font-weight="bold">Toca el gancho / clip</text>
</svg>
