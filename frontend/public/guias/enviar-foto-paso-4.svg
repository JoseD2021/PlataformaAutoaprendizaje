<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <rect width="600" height="360" fill="#f8faf9" rx="16" />
  
  <!-- Ventana de mensaje nuevo -->
  <rect x="50" y="30" width="500" height="300" rx="12" fill="#ffffff" stroke="#1a3a2a" stroke-width="2" />
  <rect x="50" y="30" width="500" height="44" rx="12" fill="#1a3a2a" />
  <text x="70" y="58" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Mensaje nuevo</text>
  
  <text x="70" y="105" fill="#555" font-family="sans-serif" font-size="14">Para: familiar@gmail.com</text>
  <text x="70" y="130" fill="#555" font-family="sans-serif" font-size="14">Asunto: Fotos del paseo</text>
  
  <!-- Archivo adjunto visible -->
  <rect x="70" y="150" width="220" height="40" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" />
  <text x="85" y="175" fill="#0d47a1" font-family="sans-serif" font-size="14" font-weight="bold">✓ mi-foto-paseo.jpg</text>
  
  <!-- Barra inferior con botón Enviar destacado -->
  <rect x="50" y="255" width="500" height="75" rx="0 0 12 12" fill="#f1f5f2" stroke="#1a3a2a" stroke-width="1" />
  
  <!-- Botón Enviar con halo -->
  <rect x="70" y="268" width="160" height="50" rx="10" fill="#1976d2" stroke="#0d47a1" stroke-width="3" />
  <text x="120" y="300" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Enviar</text>
  
  <circle cx="265" cy="293" r="18" fill="#c8102e" />
  <text x="265" y="300" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">4</text>
  <text x="295" y="300" fill="#1a3a2a" font-family="sans-serif" font-size="18" font-weight="bold">¡Toca Enviar y listo!</text>
</svg>
