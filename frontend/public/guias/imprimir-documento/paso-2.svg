<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="100%" height="100%">
  <defs>
    <linearGradient id="window-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="printer-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="printer-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow-card" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="420" height="260" fill="transparent" />

  <!-- 1. Keyboard Section (Left Side) - Featuring highlighted Ctrl and P keys -->
  <g transform="translate(15, 50)" filter="url(#shadow-card)">
    <!-- Keyboard Base Frame -->
    <rect width="190" height="136" rx="8" fill="#1e293b" />
    <rect x="7" y="7" width="176" height="122" rx="5" fill="#0f172a" />

    <!-- Keyboard Rows & Keycaps -->
    <!-- Row 1 -->
    <rect x="15" y="15" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="31" y="15" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="47" y="15" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="63" y="15" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="79" y="15" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="95" y="15" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="111" y="15" width="14" height="16" rx="2.5" fill="#334155" />
    <!-- Highlighted P Key -->
    <g transform="translate(127, 15)">
      <rect width="16" height="16" rx="2.5" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.2" />
      <text x="8" y="12" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="800" font-size="9" fill="#ffffff" text-anchor="middle">P</text>
    </g>
    <rect x="145" y="15" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="161" y="15" width="14" height="16" rx="2.5" fill="#334155" />

    <!-- Row 2 -->
    <rect x="15" y="34" width="20" height="16" rx="2.5" fill="#334155" />
    <rect x="37" y="34" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="53" y="34" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="69" y="34" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="85" y="34" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="101" y="34" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="117" y="34" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="133" y="34" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="149" y="34" width="26" height="16" rx="2.5" fill="#334155" />

    <!-- Row 3 -->
    <rect x="15" y="53" width="24" height="16" rx="2.5" fill="#334155" />
    <rect x="41" y="53" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="57" y="53" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="73" y="53" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="89" y="53" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="105" y="53" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="121" y="53" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="137" y="53" width="38" height="16" rx="2.5" fill="#334155" />

    <!-- Row 4 (Ctrl Key Highlighted) -->
    <g transform="translate(15, 72)">
      <rect width="24" height="16" rx="2.5" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.2" />
      <text x="12" y="11" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="700" font-size="7.5" fill="#ffffff" text-anchor="middle">Ctrl</text>
    </g>
    <rect x="41" y="72" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="57" y="72" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="73" y="72" width="50" height="16" rx="2.5" fill="#475569" /> <!-- Spacebar -->
    <rect x="125" y="72" width="14" height="16" rx="2.5" fill="#334155" />
    <rect x="141" y="72" width="34" height="16" rx="2.5" fill="#334155" />
  </g>

  <!-- 2. Computer Window Section (Right Side) with small printer icon inside toolbar -->
  <g transform="translate(225, 35)" filter="url(#shadow-card)">
    <!-- Window Outer Frame -->
    <rect width="180" height="190" rx="6" fill="url(#window-grad)" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Window Header Bar -->
    <path d="M 1 6 C 1 3.238 3.238 1 6 1 L 174 1 C 176.762 1 179 3.238 179 6 L 179 24 L 1 24 Z" fill="#f1f5f9" />
    <line x1="1" y1="24" x2="179" y2="24" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Window Dots -->
    <circle cx="11" cy="12.5" r="2.5" fill="#f87171" />
    <circle cx="21" cy="12.5" r="2.5" fill="#fbbf24" />
    <circle cx="31" cy="12.5" r="2.5" fill="#34d399" />

    <!-- Application Toolbar / Action Area -->
    <rect x="10" y="32" width="160" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Small Printer Icon Button inside the Window Toolbar -->
    <g transform="translate(18, 36)" filter="url(#shadow-card)">
      <rect width="24" height="16" rx="3" fill="#3b82f6" />
      <!-- Mini Printer Shape inside button -->
      <rect x="6" y="5" width="12" height="7" rx="1.5" fill="#ffffff" />
      <rect x="8" y="3" width="8" height="3" fill="#cbd5e1" />
      <rect x="8" y="9" width="8" height="3" fill="#94a3b8" />
    </g>

    <!-- Document Content Preview inside Window -->
    <!-- Document Container -->
    <rect x="25" y="70" width="130" height="100" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Mini Document Header -->
    <rect x="40" y="82" width="50" height="4" rx="1.5" fill="#64748b" />
    <rect x="40" y="90" width="30" height="3" rx="1" fill="#94a3b8" />

    <line x1="35" y1="104" x2="145" y2="104" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Document Lines -->
    <rect x="35" y="114" width="75" height="3.5" rx="1" fill="#cbd5e1" />
    <rect x="35" y="123" width="90" height="3.5" rx="1" fill="#cbd5e1" />
    <rect x="35" y="132" width="60" height="3.5" rx="1" fill="#cbd5e1" />

    <line x1="35" y1="144" x2="145" y2="144" stroke="#e2e8f0" stroke-width="1" />

    <!-- Total Row -->
    <rect x="35" y="152" width="22" height="4" rx="1" fill="#475569" />
    <rect x="115" y="152" width="30" height="4" rx="1" fill="#0f172a" />
  </g>
</svg>