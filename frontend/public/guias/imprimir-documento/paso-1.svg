<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="100%" height="100%">
  <defs>
    <linearGradient id="pdf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="window-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow-lg" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background / Ambient Glow representing desktop/environment -->
  <rect width="420" height="280" fill="transparent" />

  <!-- 1. The PDF File Icon (positioned on the left side, slightly scaled back) -->
  <g transform="translate(35, 45)" filter="url(#shadow-sm)">
    <!-- Document Base -->
    <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 82 0 L 115 33 L 115 146 C 115 153.732 108.732 160 101 160 L 14 160 C 6.268 160 0 153.732 0 146 Z" fill="url(#pdf-grad)" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Folded Corner -->
    <path d="M 82 0 L 82 33 L 115 33 Z" fill="#94a3b8" opacity="0.4" />
    <path d="M 82 0 L 115 33 L 82 33 Z" fill="#ffffff" />

    <!-- PDF Red Badge -->
    <g transform="translate(18, 24)">
      <rect width="36" height="18" rx="3" fill="url(#badge-grad)" />
      <text x="18" y="13" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="800" font-size="9" fill="#ffffff" text-anchor="middle">PDF</text>
    </g>

    <!-- Mini Receipt Lines inside file icon -->
    <rect x="62" y="30" width="38" height="3" rx="1" fill="#94a3b8" />
    <line x1="18" y1="58" x2="97" y2="58" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 2" />
    <rect x="18" y="70" width="45" height="3" rx="1" fill="#cbd5e1" />
    <rect x="80" y="70" width="17" height="3" rx="1" fill="#cbd5e1" />
    <rect x="18" y="82" width="55" height="3" rx="1" fill="#cbd5e1" />
    <rect x="80" y="82" width="17" height="3" rx="1" fill="#cbd5e1" />
    <rect x="18" y="94" width="35" height="3" rx="1" fill="#cbd5e1" />
    <line x1="18" y1="108" x2="97" y2="108" stroke="#e2e8f0" stroke-width="1" />
    <rect x="18" y="118" width="22" height="4" rx="1" fill="#64748b" />
    <rect x="74" y="118" width="23" height="4" rx="1" fill="#0f172a" />
  </g>

  <!-- Connection / Opening Action Motion Lines -->
  <g stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.5">
    <path d="M 158 110 C 175 110, 185 110, 202 110" />
  </g>

  <!-- 2. The Full Document Window Opening Up (Right side, larger and detailed) -->
  <g transform="translate(185, 25)" filter="url(#shadow-lg)">
    <!-- Window Outer Frame -->
    <rect width="200" height="230" rx="8" fill="url(#window-grad)" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Window Header Bar -->
    <path d="M 1 8 C 1 3.582 4.582 1 9 1 L 191 1 C 195.418 1 199 3.582 199 8 L 199 26 L 1 26 Z" fill="#f1f5f9" />
    <line x1="1" y1="26" x2="199" y2="26" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="13" cy="13.5" r="3" fill="#f87171" />
    <circle cx="25" cy="13.5" r="3" fill="#fbbf24" />
    <circle cx="37" cy="13.5" r="3" fill="#34d399" />
    
    <!-- File Name in Header -->
    <rect x="75" y="11.5" width="50" height="4" rx="2" fill="#94a3b8" />

    <!-- Expanded Receipt / Document Content Inside Window -->
    <!-- Receipt Header -->
    <circle cx="100" cy="54" r="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
    <path d="M96 54 L99 57 L105 50" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    
    <rect x="70" y="72" width="60" height="5" rx="2" fill="#334155" />
    <rect x="80" y="81" width="40" height="3.5" rx="1.5" fill="#94a3b8" />

    <line x1="25" y1="98" x2="175" y2="98" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- Detailed Line Items -->
    <rect x="30" y="114" width="70" height="4.5" rx="1.5" fill="#64748b" />
    <rect x="135" y="114" width="35" height="4.5" rx="1.5" fill="#64748b" />

    <rect x="30" y="132" width="85" height="4.5" rx="1.5" fill="#94a3b8" />
    <rect x="135" y="132" width="35" height="4.5" rx="1.5" fill="#94a3b8" />

    <rect x="30" y="150" width="55" height="4.5" rx="1.5" fill="#94a3b8" />
    <rect x="135" y="150" width="35" height="4.5" rx="1.5" fill="#94a3b8" />

    <line x1="25" y1="170" x2="175" y2="170" stroke="#cbd5e1" stroke-width="1" />

    <!-- Total Section -->
    <rect x="30" y="184" width="35" height="6" rx="2" fill="#1e293b" />
    <rect x="125" y="184" width="45" height="6" rx="2" fill="#0f172a" />
  </g>

  <!-- Double Click / Opening Interactive Indicator (Cursor hovering over file icon) -->
  <g transform="translate(100, 140)">
    <!-- Click Ripple Effects -->
    <circle cx="11" cy="15" r="14" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.5" />
    <circle cx="11" cy="15" r="22" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.25" />
    
    <!-- Cursor Arrow -->
    <path d="M0 0 L11 15 L6.5 16.5 L9.5 22.5 L7.5 23.5 L4.5 17.5 L1 21 Z" fill="#0f172a" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />
  </g>
</svg>