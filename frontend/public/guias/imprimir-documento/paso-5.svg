<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="100%" height="100%">
  <defs>
    <linearGradient id="printer-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="printer-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow-card" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="420" height="260" fill="transparent" />

  <!-- Printer & Output Tray Section (Centered) -->
  <g transform="translate(110, 40)" filter="url(#shadow-card)">
    <!-- Printer Top Extension / Tray -->
    <rect x="25" y="10" width="150" height="20" rx="4" fill="url(#printer-top)" />

    <!-- Main Printer Body -->
    <rect width="200" height="110" rx="10" fill="url(#printer-body)" stroke="#cbd5e1" stroke-width="1" />

    <!-- Printer Status Light & Panel -->
    <circle cx="20" cy="24" r="3" fill="#22c55e" /> <!-- Green ready light -->
    <rect x="160" y="22" width="20" height="4" rx="2" fill="#cbd5e1" />

    <!-- Paper Output Slot -->
    <rect x="35" y="62" width="130" height="8" rx="4" fill="#64748b" />

    <!-- Output Tray (Extending Forward) -->
    <path d="M 35 70 L 165 70 L 180 140 L 20 140 Z" fill="#cbd5e1" opacity="0.5" />

    <!-- Printed Document Resting on the Tray -->
    <g transform="translate(50, 75)">
      <rect width="100" height="65" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <!-- Content lines on the printed sheet -->
      <rect x="15" y="12" width="45" height="3.5" rx="1" fill="#64748b" />
      <rect x="15" y="20" width="70" height="2.5" rx="1" fill="#cbd5e1" />
      <rect x="15" y="27" width="60" height="2.5" rx="1" fill="#cbd5e1" />
      <rect x="15" y="34" width="65" height="2.5" rx="1" fill="#cbd5e1" />
      <line x1="15" y1="44" x2="85" y2="44" stroke="#f1f5f9" stroke-width="1" />
      <rect x="15" y="50" width="25" height="3" rx="1" fill="#475569" />
      <rect x="65" y="50" width="20" height="3" rx="1" fill="#0f172a" />
    </g>
  </g>
</svg>