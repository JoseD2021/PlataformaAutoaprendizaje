<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="100%" height="100%">
  <defs>
    <linearGradient id="window-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow-modal" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="420" height="180" fill="transparent" />

  <!-- Print Dialog Window Bottom Bar Section (Zoomed In / Focused) -->
  <g transform="translate(60, 20)" filter="url(#shadow-modal)">
    <!-- Container representing the bottom portion of the print window -->
    <rect width="300" height="140" rx="8" fill="url(#window-grad)" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Top separator or subtle shadow line inside modal -->
    <line x1="0" y1="15" x2="300" y2="15" stroke="#f1f5f9" stroke-width="1" />

    <!-- Hint of settings above -->
    <rect x="25" y="32" width="120" height="4" rx="1.5" fill="#e2e8f0" />
    <rect x="25" y="44" width="80" height="3" rx="1" fill="#f1f5f9" />
    <rect x="25" y="56" width="150" height="3" rx="1" fill="#f1f5f9" />

    <!-- Divider line right above action buttons -->
    <line x1="0" y1="80" x2="300" y2="80" stroke="#e2e8f0" stroke-width="1" />

    <!-- Bottom Action Buttons Group -->
    <!-- Print Button (Blue, positioned on the left side of the action area) -->
    <g transform="translate(25, 96)">
      <!-- Click / Ripple Effect Indicator -->
      <circle cx="38" cy="12" r="18" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.4" />
      <circle cx="38" cy="12" r="26" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.2" />

      <!-- Button Body -->
      <rect width="76" height="26" rx="4" fill="#3b82f6" />
      <text x="38" y="17" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="600" font-size="11" fill="#ffffff" text-anchor="middle">Imprimir</text>
    </g>

    <!-- Cancel Button (Positioned to the right of Print) -->
    <g transform="translate(110, 96)">
      <rect width="76" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <text x="38" y="17" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="500" font-size="11" fill="#475569" text-anchor="middle">Cancelar</text>
    </g>

    <!-- Mouse Cursor Clicking the Print Button -->
    <g transform="translate(50, 105)">
      <!-- Cursor Arrow -->
      <path d="M0 0 L11 15 L6.5 16.5 L9.5 22.5 L7.5 23.5 L4.5 17.5 L1 21 Z" fill="#0f172a" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />
    </g>
  </g>
</svg>