<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="100%" height="100%">
  <defs>
    <linearGradient id="window-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow-modal" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="420" height="280" fill="transparent" />

  <!-- Print Dialog Window (Centered & Highlighted) -->
  <g transform="translate(60, 20)" filter="url(#shadow-modal)">
    <!-- Window Outer Frame -->
    <rect width="300" height="240" rx="8" fill="url(#window-grad)" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Window Header Bar -->
    <path d="M 1 7 C 1 3.686 3.686 1 7 1 L 293 1 C 296.314 1 299 3.686 299 7 L 299 26 L 1 26 Z" fill="#f1f5f9" />
    <line x1="1" y1="26" x2="299" y2="26" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="13" cy="13.5" r="3" fill="#f87171" />
    <circle cx="23" cy="13.5" r="3" fill="#fbbf24" />
    <circle cx="33" cy="13.5" r="3" fill="#34d399" />
    <text x="150" y="17" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="600" font-size="11" fill="#64748b" text-anchor="middle">Imprimir</text>

    <!-- Content Area inside Print Modal -->
    <!-- Left side: Preview thumbnail -->
    <g transform="translate(20, 42)">
      <rect width="90" height="120" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <!-- Thumbnail text lines -->
      <rect x="12" y="16" width="40" height="3" rx="1" fill="#94a3b8" />
      <rect x="12" y="24" width="66" height="2" rx="0.5" fill="#e2e8f0" />
      <rect x="12" y="30" width="55" height="2" rx="0.5" fill="#e2e8f0" />
      <rect x="12" y="36" width="60" height="2" rx="0.5" fill="#e2e8f0" />
      <line x1="12" y1="46" x2="78" y2="46" stroke="#f1f5f9" stroke-width="1" />
      <rect x="12" y="54" width="30" height="2" rx="0.5" fill="#cbd5e1" />
      <rect x="12" y="60" width="50" height="2" rx="0.5" fill="#cbd5e1" />
    </g>

    <!-- Right side: Print Settings / Form Fields -->
    <g transform="translate(125, 42)">
      <!-- Field 1: Printer Name Selection (Highlighted) -->
      <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="600" font-size="10" fill="#475569">Impresora</text>
      <rect x="0" y="15" width="155" height="26" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" />
      <!-- Printer Icon & Name inside selector -->
      <path d="M10 26.5 H18 M14 22.5 V30.5" stroke="#64748b" stroke-width="1.2" />
      <rect x="22" y="24.5" width="10" height="7" rx="1" fill="#64748b" />
      <text x="37" y="31" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="500" font-size="10" fill="#0f172a">Impresora de la sala</text>
      <!-- Dropdown arrow -->
      <path d="M142 27.5 L145 30.5 L148 27.5" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Field 2: Copies Selection (Highlighted) -->
      <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="600" font-size="10" fill="#475569">Copias</text>
      <rect x="0" y="68" width="60" height="26" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" />
      <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="700" font-size="12" fill="#0f172a">1</text>
      <path d="M48 78 L51 81 L54 78" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Additional dummy settings lines -->
      <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="600" font-size="10" fill="#94a3b8">Páginas</text>
      <rect x="0" y="121" width="155" height="22" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
      <text x="10" y="136" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10" fill="#64748b">Todas</text>
    </g>

    <!-- Bottom Action Buttons (Print / Cancel) -->
    <line x1="0" y1="195" x2="300" y2="195" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Cancel Button -->
    <rect x="155" y="206" width="60" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="185" y="222" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="500" font-size="10" fill="#475569" text-anchor="middle">Cancelar</text>

    <!-- Print Button -->
    <rect x="225" y="206" width="60" height="24" rx="4" fill="#3b82f6" />
    <text x="255" y="222" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="600" font-size="10" fill="#ffffff" text-anchor="middle">Imprimir</text>
  </g>
</svg>